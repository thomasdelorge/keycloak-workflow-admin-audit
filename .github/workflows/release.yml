# Builds the provider JAR and publishes a GitHub Release (assets + SHA256).
# Runs only when a version tag matching v* is pushed (e.g. v1.0.0).
# Align pom.xml <version> with the tag when you cut a release (e.g. v1.0.0 ↔ 1.0.0).
#
# GitHub Actions does not support permissions on a single step: only workflow or job.
# Splitting build vs release keeps contents:write off the Maven/build job; only the release job can publish.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build JAR
        run: mvn -B -ntp -Pkeycloak-snapshots -DskipTests package

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          JAR="$(find target -maxdepth 1 -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)"
          test -n "${JAR}" && test -f "${JAR}"
          cp "${JAR}" dist/
          JAR_BASE="$(basename "${JAR}")"
          (cd dist && sha256sum "${JAR_BASE}" > "${JAR_BASE}.sha256")
          ls -la dist/
          cat "dist/${JAR_BASE}.sha256"

      - name: Upload artifacts for release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: dist/

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.jar
            dist/*.sha256
